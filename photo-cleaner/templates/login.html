<!doctype html>
<html><head><title>Login</title>
<style>body{font-family:Arial;max-width:400px;margin:50px auto}input{width:100%;padding:10px;margin:5px 0}button{padding:10px 20px;width:100%}</style>
</head><body>
<h2>Login - Smart Photo Cleaner</h2>
{% with messages = get_flashed_messages() %}{% if messages %}<p style="color:red">{{ messages[0] }}</p>{% endif %}{% endwith %}
<form method="post">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p>No account? <a href="/register">Register</a></p>
</body></html>
