[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credibility-auditor"
version = "0.1.0"
description = "Multi-signal credibility scoring for news articles (content model + source reputation + citations)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "lxml>=5.0",
    "tldextract>=5.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
model = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
credibility-auditor = "credibility_auditor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
