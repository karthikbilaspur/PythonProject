[project]
name = "aws-ops-toolkit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34", "flask>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
