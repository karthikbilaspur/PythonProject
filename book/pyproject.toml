[project]
name = "book-manager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[project.scripts]
book-manager = "book_manager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
